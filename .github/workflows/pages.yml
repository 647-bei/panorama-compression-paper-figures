name: Deploy research figure viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install image conversion library
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --quiet Pillow
      - name: Prepare lightweight Pages artifact
        run: |
          mkdir _pages_dist
          rsync -a \
            --exclude='.git' \
            --exclude='_pages_dist' \
            --exclude='*.png' \
            --exclude='*.pptx' \
            --exclude='*.svg' \
            --exclude='*.ttf' \
            ./ _pages_dist/
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          for source in Path(".").rglob("*.png"):
              if "_pages_dist" in source.parts:
                  continue
              target = Path("_pages_dist", source.relative_to(".")).with_suffix(".webp")
              target.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(source) as image:
                  image.save(target, format="WEBP", lossless=True, quality=100, method=6)
                  preview = image.copy()
                  preview.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
                  preview_target = target.with_name(target.stem + ".preview.webp")
                  preview.save(preview_target, format="WEBP", quality=82, method=6)

          path = Path("_pages_dist/site_data.js")
          text = path.read_text(encoding="utf-8")
          payload = json.loads(text.split("=", 1)[1].strip().rstrip(";"))
          for asset in payload.get("assets", []):
              original = asset.get("original", "")
              if original.endswith(".png"):
                  original = original[:-4] + ".webp"
                  asset["original"] = original
                  asset["preview"] = original[:-5] + ".preview.webp"
          path.write_text("window.SITE_DATA = " + json.dumps(payload, ensure_ascii=False, indent=2) + ";\n", encoding="utf-8")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
