name: Deploy research figure viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install image conversion library
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --quiet Pillow
      - name: Prepare lightweight Pages artifact
        run: |
          mkdir _pages_dist
          rsync -a \
            --exclude='.git' \
            --exclude='_pages_dist' \
            --exclude='*.png' \
            --exclude='*.pptx' \
            --exclude='*.svg' \
            --exclude='*.ttf' \
            ./ _pages_dist/
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          for source in Path(".").rglob("*.png"):
              if "_pages_dist" in source.parts:
                  continue
              target = Path("_pages_dist", source.relative_to(".")).with_suffix(".webp")
              target.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(source) as image:
                  image.save(target, format="WEBP", lossless=True, quality=100, method=6)

          path = Path("_pages_dist/site_data.js")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'(["\'])([^"\']*?)\.png\1', r'\1\2.webp\1', text)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
