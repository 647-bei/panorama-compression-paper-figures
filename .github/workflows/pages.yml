name: Deploy research figure viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare lightweight Pages artifact
        run: |
          mkdir _pages_dist
          rsync -a \
            --exclude='.git' \
            --exclude='_pages_dist' \
            --exclude='*.pptx' \
            --exclude='*.svg' \
            --exclude='*.ttf' \
            ./ _pages_dist/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
