name: Deploy research figure viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install image conversion tool
        run: |
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Prepare lightweight Pages artifact
        run: |
          mkdir _pages_dist
          rsync -a \
            --exclude='.git' \
            --exclude='_pages_dist' \
            --exclude='*.png' \
            --exclude='*.pptx' \
            --exclude='*.svg' \
            --exclude='*.ttf' \
            ./ _pages_dist/
          while IFS= read -r -d '' source; do
            relative="${source#./}"
            target="_pages_dist/${relative%.png}.webp"
            mkdir -p "$(dirname "$target")"
            ffmpeg -y -loglevel error -i "$source" -c:v libwebp -lossless 1 "$target"
          done < <(find . -path './_pages_dist' -prune -o -type f -name '*.png' -print0)
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("_pages_dist/site_data.js")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'(["\'])([^"\']*?)\.png\1', r'\1\2.webp\1', text)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
